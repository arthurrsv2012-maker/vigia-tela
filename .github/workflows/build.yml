name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: |
          mkdir proj
          for z in *.zip; do unzip -o -q "$z" -d proj; done
          DIR=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          echo "PROJ_DIR=$DIR" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar
        run: |
          cd "$PROJ_DIR"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: VigiaTela-apk
          path: out/app-debug.apk
